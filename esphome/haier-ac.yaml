# ============================================================
#  Haier AC — lokalna integracja przez ESP32-C3
#  Protokół: hOn (UART 9600 baud)
#  Testowane: Haier AS50TDDHRA-CL + KZW-W002
#  Wersja: 1.0.0
# ============================================================

substitutions:
  # ─── ZMIEŃ TE WARTOŚCI NA SWOJE ───
  device_name: "haier-klima"
  friendly_name: "Klimatyzacja Salon"
  wifi_ssid: "TWOJA_SIEC_WIFI"
  wifi_password: "TWOJE_HASLO_WIFI"
  fallback_password: "fallback123"
  # ────────────────────────────────────

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Haier AC przez UART (protokół hOn)"
  platformio_options:
    board_build.flash_mode: dio
  project:
    name: "community.haier-ac-esp32"
    version: "1.0.0"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  power_save_mode: none
  fast_connect: true
  reboot_timeout: 5min
  ap:
    ssid: "${device_name}-fallback"
    password: ${fallback_password}

captive_portal:

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3

uart:
  id: haier_uart
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

climate:
  - platform: haier
    id: haier_ac
    name: "Klimatyzacja"
    uart_id: haier_uart
    protocol: hOn
    wifi_signal: true
    display: true
    update_interval: 10s
    supported_modes:
      - "OFF"
      - AUTO
      - COOL
      - HEAT
      - DRY
      - FAN_ONLY
    supported_swing_modes:
      - "OFF"
      - VERTICAL
    supported_presets:
      - BOOST
      - COMFORT
      - ECO
      - SLEEP
    visual:
      min_temperature: 16 °C
      max_temperature: 30 °C
      temperature_step: 1 °C

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart ESP"
    entity_category: diagnostic

  - platform: safe_mode
    name: "Safe Mode"
    entity_category: diagnostic

status_led:
  pin:
    number: GPIO8
    inverted: true
