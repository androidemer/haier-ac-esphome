blueprint:
  name: Haier AC - Harmonogram
  description: Włącza i wyłącza klimatyzację o określonych godzinach.
  domain: automation
  input:
    climate_entity:
      name: Klimatyzacja
      default: climate.klimatyzacja
      selector:
        entity:
          domain: climate
    start_time:
      name: Godzina włączenia
      default: "07:00:00"
      selector:
        time:
    end_time:
      name: Godzina wyłączenia
      default: "22:00:00"
      selector:
        time:
    temperature:
      name: Temperatura (°C)
      default: 22
      selector:
        number:
          min: 16
          max: 30
          step: 1
          unit_of_measurement: °C

trigger:
  - platform: time
    at: !input start_time
    id: on
  - platform: time
    at: !input end_time
    id: off

action:
  - choose:
      - conditions:
          - condition: trigger
            id: on
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: cool
              temperature: !input temperature
      - conditions:
          - condition: trigger
            id: off
        sequence:
          - service: climate.turn_off
            target:
              entity_id: !input climate_entity

mode: single
