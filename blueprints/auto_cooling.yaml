blueprint:
  name: Haier AC - Automatyczne chłodzenie
  description: Włącza klimatyzację gdy jest za ciepło, wyłącza gdy temperatura spadnie.
  domain: automation
  input:
    temperature_sensor:
      name: Czujnik temperatury
      selector:
        entity:
          domain: sensor
          device_class: temperature
    climate_entity:
      name: Klimatyzacja
      default: climate.klimatyzacja
      selector:
        entity:
          domain: climate
    temp_on:
      name: Włącz powyżej (°C)
      default: 25
      selector:
        number:
          min: 18
          max: 32
          step: 0.5
          unit_of_measurement: °C
    temp_off:
      name: Wyłącz poniżej (°C)
      default: 22
      selector:
        number:
          min: 15
          max: 28
          step: 0.5
          unit_of_measurement: °C
    target_temp:
      name: Temperatura docelowa (°C)
      default: 22
      selector:
        number:
          min: 16
          max: 30
          step: 1
          unit_of_measurement: °C

trigger:
  - platform: numeric_state
    entity_id: !input temperature_sensor
    above: !input temp_on
    id: too_hot
  - platform: numeric_state
    entity_id: !input temperature_sensor
    below: !input temp_off
    id: cold_enough

action:
  - choose:
      - conditions:
          - condition: trigger
            id: too_hot
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: cool
              temperature: !input target_temp
      - conditions:
          - condition: trigger
            id: cold_enough
        sequence:
          - service: climate.turn_off
            target:
              entity_id: !input climate_entity

mode: single
